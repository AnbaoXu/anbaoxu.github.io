<script type="text/javascript" id="clstr_globe" src="//clustrmaps.com/map_v2.js?d=19SkOTvgZhKO46cBNNPcYLIYLG0UhWjp4XfNKND_PWw&w=100" ></script>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script type="text/javascript">
(function () {
  var ORCID_ID = '0000-0003-2755-0013';
  var API = 'https://pub.orcid.org/v3.0';
  var box = document.getElementById('publications-container');
  var bibBox = document.getElementById('bibtex-container');
  if (!box && !bibBox) { return; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function isSelf(name) {
    return /an[\s-]?bao\s*xu/i.test(name) || /xu\s*,\s*an[\s-]?bao/i.test(name);
  }
  function dateKey(w) {
    var d = w['publication-date'] || {};
    var y = parseInt((d.year || {}).value || '0', 10);
    var m = parseInt((d.month || {}).value || '0', 10);
    return y * 100 + m;
  }
  function render(works) {
    var html = '<ul>';
    for (var i = 0; i < works.length; i++) {
      var w = works[i];
      var title = ((w.title || {}).title || {}).value || '(untitled)';
      var journal = ((w['journal-title'] || {}).value || '');
      var year = (((w['publication-date'] || {}).year || {}).value || '');
      var doi = '';
      var doiUrl = '';
      var ids = ((w['external-ids'] || {})['external-id'] || []);
      for (var j = 0; j < ids.length; j++) {
        if (ids[j]['external-id-type'] === 'doi' && !doi) {
          doi = ids[j]['external-id-value'] || '';
          doiUrl = ((ids[j]['external-id-url'] || {}).value) || ('https://doi.org/' + doi);
        }
      }
      var authors = [];
      var cs = ((w.contributors || {}).contributor || []);
      for (var k = 0; k < cs.length; k++) {
        var nm = ((cs[k]['credit-name'] || {}).value || '');
        if (!nm) { continue; }
        authors.push(isSelf(nm) ? '<b>' + esc(nm) + '</b>' : esc(nm));
      }
      html += '<li><p>';
      if (authors.length) { html += authors.join(', ') + ', '; }
      html += esc(title);
      if (journal) { html += ', ' + esc(journal); }
      if (year) { html += ', ' + esc(year); }
      if (doi) { html += '. <a href="' + esc(doiUrl) + '">DOI: ' + esc(doi) + '</a>'; }
      html += '</p></li>';
    }
    html += '</ul>';
    box.innerHTML = html;
  }
  function bibAuthor(nm) {
    nm = nm.trim();
    if (nm.indexOf(',') >= 0) { return nm; }
    var p = nm.split(/\s+/);
    if (p.length < 2) { return nm; }
    return p[p.length - 1] + ', ' + p.slice(0, -1).join(' ');
  }
  function bibKey(w, year) {
    var cs = ((w.contributors || {}).contributor || []);
    var ln = 'xu';
    if (cs.length) {
      var nm = ((cs[0]['credit-name'] || {}).value || '');
      ln = (nm.indexOf(',') >= 0 ? nm.split(',')[0] : nm.trim().split(/\s+/).pop()) || 'xu';
      ln = ln.toLowerCase().replace(/[^a-z]/g, '') || 'xu';
    }
    var tw = 'paper';
    var words = ((((w.title || {}).title || {}).value) || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function (x) { return x.length > 3; });
    if (words.length) { tw = words[0]; }
    return ln + year + tw;
  }
  function orcidBibtex(w) {
    var year = (((w['publication-date'] || {}).year || {}).value || '');
    var key = bibKey(w, year);
    var authors = ((w.contributors || {}).contributor || []).map(function (c) { return bibAuthor(((c['credit-name'] || {}).value || '')); }).filter(Boolean).join(' and ');
    var title = ((w.title || {}).title || {}).value || '(untitled)';
    var journal = ((w['journal-title'] || {}).value || '');
    var doi = '';
    var ids = ((w['external-ids'] || {})['external-id'] || []);
    for (var j = 0; j < ids.length; j++) {
      if (ids[j]['external-id-type'] === 'doi') { doi = ids[j]['external-id-value'] || ''; break; }
    }
    if (journal) {
      return '@article{' + key + ',\n  author = {' + authors + '},\n  title = {' + title + '},\n  journal = {' + journal + '},\n  year = {' + year + '}' + (doi ? ',\n  doi = {' + doi + '}' : '') + '\n}';
    }
    var eprint = '';
    if (doi.indexOf('10.48550') === 0) { eprint = doi.split('/').pop(); }
    return '@misc{' + key + ',\n  author = {' + authors + '},\n  title = {' + title + '},\n  year = {' + year + '}' + (eprint ? ',\n  eprint = {' + eprint + '},\n  archivePrefix = {arXiv}' : '') + (doi ? ',\n  doi = {' + doi + '}' : '') + '\n}';
  }
  var staticBib = [
    '@misc{guo2024trajectory,\n  author = {Guo, Jiahao and Xu, An-Bao},\n  title = {High-Performance Privacy-Preserving Matrix Completion for Trajectory Recovery},\n  year = {2024},\n  eprint = {2405.05789},\n  archivePrefix = {arXiv},\n  doi = {10.48550/arXiv.2405.05789}\n}',
    '@misc{zhao2024infrared,\n  author = {Zhao, Jiqian and Xu, An-Bao},\n  title = {Infrared Small Target Detection via Tensor $L_{2,1}$-Norm Minimization and ASSTV Regularization: A Novel Tensor Recovery Approach},\n  year = {2024},\n  eprint = {2402.18003},\n  archivePrefix = {arXiv},\n  doi = {10.48550/arXiv.2402.18003}\n}',
    '@misc{wu2021biased,\n  author = {Wu, Qianxi and Xu, An-Bao},\n  title = {A Biased Deep Tensor Factorization Network for Tensor Completion},\n  year = {2021},\n  eprint = {2105.09629},\n  archivePrefix = {arXiv},\n  doi = {10.48550/arXiv.2105.09629}\n}',
    '@misc{xu2020tensor,\n  author = {Xu, An-Bao},\n  title = {Tensor Completion via a Low-Rank Approximation Pursuit},\n  year = {2020},\n  eprint = {2004.08872},\n  archivePrefix = {arXiv},\n  doi = {10.48550/arXiv.2004.08872}\n}'
  ];
  function fallbackCopy(code, btn) {
    var ta = document.createElement('textarea');
    ta.value = code.textContent;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '已复制';
  }
  function renderBibtex(works) {
    if (!bibBox) { return; }
    var entries = works.map(orcidBibtex).concat(staticBib);
    bibBox.innerHTML = '<p><button id="bibtex-copy" type="button">复制 BibTeX</button></p><pre id="bibtex-code">' + esc(entries.join('\n\n')) + '</pre>';
    var btn = document.getElementById('bibtex-copy');
    var code = document.getElementById('bibtex-code');
    btn.onclick = function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code.textContent).then(function () { btn.textContent = '已复制'; }, function () { fallbackCopy(code, btn); });
      } else {
        fallbackCopy(code, btn);
      }
    };
  }
  function retypeset() {
    if (window.MathJax && window.MathJax.typesetPromise) { MathJax.typesetPromise().catch(function () {}); }
  }
  fetch(API + '/' + ORCID_ID + '/works', { headers: { 'Accept': 'application/json' } })
    .then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.json();
    })
    .then(function (d) {
      var groups = d.group || [];
      var works = [];
      for (var i = 0; i < groups.length; i++) {
        var w = (groups[i]['work-summary'] || [])[0];
        if (w) { works.push(w); }
      }
      works.sort(function (a, b) { return dateKey(b) - dateKey(a); });
      return Promise.all(works.map(function (w) {
        return fetch(API + '/' + ORCID_ID + '/work/' + w['put-code'], { headers: { 'Accept': 'application/json' } })
          .then(function (r) { return r.json(); })
          .then(function (detail) { w.contributors = detail.contributors; return w; })
          .catch(function () { return w; });
      }));
    })
    .then(function (works) { render(works); renderBibtex(works); retypeset(); })
    .catch(function () {
      if (box) { box.innerHTML = '<p>无法实时加载 ORCID 数据，请访问 <a href="https://orcid.org/' + ORCID_ID + '">ORCID 主页</a> 查看论文列表。</p>'; }
      renderBibtex([]);
    });
})();
</script>

